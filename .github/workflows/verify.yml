name: Verify Dis-Unity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical state
        run: python scripts/validate_state.py Resilience_Cascade_STATE.json
      - name: Check current cycle status
        run: python scripts/cycle.py status RC-003
      - name: Run integrity tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated views are reproducible
        run: |
          python scripts/render_state.py Resilience_Cascade_STATE.json
          git diff --exit-code -- state
