name: Verify Dis-Unity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical state
        run: python scripts/validate_state.py Resilience_Cascade_STATE.json
      - name: Check current cycle status
        run: |
          cycle_id="$(python -c 'import json; print(json.load(open("Resilience_Cascade_STATE.json"))["meta"]["cycle_id"])')"
          python scripts/cycle.py status "$cycle_id"
      - name: Run integrity tests
        run: python -m unittest discover -s tests -v
      - name: Check Meaning Tower interaction contract
        run: node tests/test_boss_ui.js
      - name: Verify portable encounter is reproducible
        run: |
          python scripts/build_meaning_tower.py
          git diff --exit-code -- web/meaning-tower/index.html
      - name: Verify generated views are reproducible
        run: |
          python scripts/render_state.py Resilience_Cascade_STATE.json
          git diff --exit-code -- state
