name: Worker Bee Smoke Test

on:
  push:
    paths:
      - "scripts/worker.py"
      - "scripts/questions.py"
      - "scripts/reflections.py"
      - "scripts/governor.py"
      - "config/providers.json"
      - "agents/**"
      - "tests/test_worker.py"
      - "tests/test_reflections.py"
      - ".github/workflows/worker-bee.yml"
  pull_request:
    paths:
      - "scripts/worker.py"
      - "scripts/questions.py"
      - "scripts/reflections.py"
      - "scripts/governor.py"
      - "config/providers.json"
      - "agents/**"
      - "tests/test_worker.py"
      - "tests/test_reflections.py"
      - ".github/workflows/worker-bee.yml"
  workflow_dispatch:
    inputs:
      provider:
        description: "mock runs; gemini preserves a deferred request without calling a model"
        required: true
        default: "mock"
        type: choice
        options:
          - mock
          - gemini
      model:
        description: "Optional candidate model ID for the deferred record"
        required: false
        default: ""
      task:
        description: "Bounded attention request"
        required: false
        default: "Read the current attention field and leave a checkpoint."

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run worker tests
        run: python -m unittest tests.test_worker tests.test_reflections -v
      - name: Run worker
        shell: bash
        env:
          REQUESTED_PROVIDER: ${{ inputs.provider || 'mock' }}
          REQUESTED_MODEL: ${{ inputs.model || 'unselected' }}
          REQUESTED_TASK: ${{ inputs.task || 'Read the current attention field and leave a checkpoint.' }}
        run: |
          mkdir -p "$RUNNER_TEMP/worker-bee"
          python scripts/worker.py \
            --role agents/worker_bee.json \
            --cycle runtime-check \
            --provider "$REQUESTED_PROVIDER" \
            --model "$REQUESTED_MODEL" \
            --task "$REQUESTED_TASK" \
            --output "$RUNNER_TEMP/worker-bee/checkpoint.json"
      - name: Preserve request and attempt records even after interruption
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/worker-bee"
          cp operations/questions.json "$RUNNER_TEMP/worker-bee/questions.json"
          if [ -f operations/reflections/mailbox.json ]; then
            cp operations/reflections/mailbox.json "$RUNNER_TEMP/worker-bee/reflections.json"
          fi
      - name: Upload recoverable worker records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-bee-records
          path: ${{ runner.temp }}/worker-bee/
          if-no-files-found: error
